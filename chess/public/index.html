<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiplayer Chess</title>
<style>
  :root { --light:#f0d9b5; --dark:#b58863; --bg:#262421; --fg:#eee; --accent:#81b64c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; display:flex; justify-content:center; padding:16px; }
  .wrap { width:100%; max-width:960px; }
  h1 { margin:0 0 12px; font-size:1.4rem; }
  button { background:#3d3a37; color:var(--fg); border:0; padding:10px 16px; border-radius:6px; font-size:1rem; cursor:pointer; }
  button:hover { background:#4a4744; }
  button.primary { background:var(--accent); color:#111; font-weight:600; }
  input { padding:10px; border-radius:6px; border:1px solid #555; background:#1c1a18; color:var(--fg); font-size:1rem; text-transform:uppercase; width:120px; }
  #lobby { display:flex; flex-direction:column; gap:14px; max-width:360px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  #game { display:none; gap:20px; flex-wrap:wrap; }
  #boardWrap { flex:1 1 360px; max-width:560px; }
  #board { display:grid; grid-template-columns:repeat(8,1fr); aspect-ratio:1; border:2px solid #111; user-select:none; }
  .sq { position:relative; display:flex; align-items:center; justify-content:center; font-size:min(8vw,52px); cursor:pointer; line-height:1; }
  .sq.l { background:var(--light); } .sq.d { background:var(--dark); }
  .sq.sel { box-shadow:inset 0 0 0 4px #f6f669; }
  .sq.last { background-image:linear-gradient(rgba(255,235,59,.4),rgba(255,235,59,.4)); }
  .sq.chk { background-image:radial-gradient(circle,rgba(255,0,0,.8),rgba(255,0,0,0) 70%); }
  .sq.hint::after { content:''; position:absolute; width:28%; height:28%; border-radius:50%; background:rgba(0,0,0,.25); }
  .sq.hint.cap::after { width:90%; height:90%; background:none; border:5px solid rgba(0,0,0,.25); }
  .w-piece { color:#fff; text-shadow:0 0 2px #000,0 0 2px #000,0 0 3px #000; }
  .b-piece { color:#111; text-shadow:0 0 1px #fff; }
  .coord { position:absolute; font-size:10px; opacity:.7; color:#000; font-family:sans-serif; }
  .coord.r { top:2px; left:3px; } .coord.f { bottom:1px; right:3px; }
  #side { flex:1 1 240px; display:flex; flex-direction:column; gap:12px; }
  #status { font-size:1.1rem; font-weight:600; min-height:1.5em; }
  #info { opacity:.8; }
  #moves { background:#1c1a18; border-radius:6px; padding:10px; height:240px; overflow:auto; display:grid; grid-template-columns:36px 1fr 1fr; gap:2px 8px; align-content:start; font-family:monospace; }
  #moves .n { opacity:.5; }
  #promo { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center; }
  #promo div { background:#333; padding:16px; border-radius:8px; display:flex; gap:10px; }
  #promo button { font-size:2.4rem; padding:8px 14px; }
  #err { color:#f88; min-height:1.2em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>♟ Multiplayer Chess</h1>
  <div id="lobby">
    <div class="row"><button class="primary" data-color="">New game (random)</button><button data-color="w">White</button><button data-color="b">Black</button></div>
    <div class="row"><input id="code" placeholder="CODE" maxlength="5"><button id="joinBtn">Join game</button></div>
    <div id="err"></div>
  </div>
  <div id="game">
    <div id="boardWrap"><div id="board"></div></div>
    <div id="side">
      <div id="status"></div>
      <div id="info"></div>
      <div class="row">
        <button id="copy">Copy invite link</button>
        <button id="draw">Offer draw</button>
        <button id="resign">Resign</button>
      </div>
      <div class="row" id="drawBox" style="display:none">Opponent offers a draw: <button id="acceptDraw" class="primary">Accept</button><button id="declineDraw">Decline</button></div>
      <div id="moves"></div>
      <div id="err2" style="color:#f88"></div>
    </div>
  </div>
</div>
<div id="promo"><div></div></div>
<script>
const GLYPH = { k:'♚', q:'♛', r:'♜', b:'♝', n:'♞', p:'♟' };
let ws, st = null, selected = null;
const $ = id => document.getElementById(id);

function connect(then) {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = then;
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'error') { $('err').textContent = m.message; $('err2').textContent = m.message; setTimeout(() => $('err2').textContent = '', 2500); }
    else if (m.type === 'state') { st = m; selected = null; $('err').textContent = ''; show(); }
  };
  ws.onclose = () => { if (st) $('status').textContent = 'Disconnected — reload to rejoin'; };
}
const send = o => ws.send(JSON.stringify(o));

document.querySelectorAll('[data-color]').forEach(b => b.onclick = () => connect(() => send({ type: 'create', color: b.dataset.color })));
$('joinBtn').onclick = () => { const id = $('code').value.trim(); if (id) connect(() => send({ type: 'join', id })); };
$('resign').onclick = () => confirm('Resign?') && send({ type: 'resign' });
$('draw').onclick = () => send({ type: 'offerDraw' });
$('acceptDraw').onclick = () => send({ type: 'acceptDraw' });
$('declineDraw').onclick = () => send({ type: 'declineDraw' });
$('copy').onclick = () => { navigator.clipboard?.writeText(location.origin + '/?game=' + st.id); $('copy').textContent = 'Copied!'; setTimeout(() => $('copy').textContent = 'Copy invite link', 1500); };

const gid = new URLSearchParams(location.search).get('game');
if (gid) { $('code').value = gid; connect(() => send({ type: 'join', id: gid })); }

function parseFen(fen) {
  const rows = fen.split(' ')[0].split('/');
  return rows.map(r => [...r].flatMap(c => /\d/.test(c) ? Array(+c).fill(null) : [c]));
}

function show() {
  $('lobby').style.display = 'none';
  $('game').style.display = 'flex';
  const grid = parseFen(st.fen);
  const flip = st.color === 'b';
  const boardEl = $('board');
  boardEl.innerHTML = '';
  const targets = selected ? st.moves.filter(m => m.from === selected).map(m => m.to) : [];
  const kingSq = st.check ? findKing(grid, st.turn) : null;
  for (let i = 0; i < 64; i++) {
    const r = flip ? 7 - Math.floor(i / 8) : Math.floor(i / 8);
    const f = flip ? 7 - (i % 8) : i % 8;
    const name = 'abcdefgh'[f] + (8 - r);
    const p = grid[r][f];
    const el = document.createElement('div');
    el.className = 'sq ' + ((r + f) % 2 ? 'd' : 'l');
    if (name === selected) el.classList.add('sel');
    if (st.last && (name === st.last.from || name === st.last.to)) el.classList.add('last');
    if (name === kingSq) el.classList.add('chk');
    if (targets.includes(name)) el.classList.add('hint', ...(p ? ['cap'] : []));
    if (p) { const s = document.createElement('span'); s.className = p === p.toUpperCase() ? 'w-piece' : 'b-piece'; s.textContent = GLYPH[p.toLowerCase()]; el.appendChild(s); }
    if (i % 8 === 0) el.insertAdjacentHTML('beforeend', `<span class="coord r">${8 - r}</span>`);
    if (i >= 56) el.insertAdjacentHTML('beforeend', `<span class="coord f">${'abcdefgh'[f]}</span>`);
    el.onclick = () => clickSq(name);
    boardEl.appendChild(el);
  }
  let text;
  if (st.result) text = st.result;
  else if (!st.opponent) text = 'Waiting for opponent… share code ' + st.id;
  else text = (st.turn === st.color ? 'Your move' : "Opponent's move") + (st.check ? ' — check!' : '');
  $('status').textContent = text;
  $('info').textContent = `Game ${st.id} · You are ${st.color === 'w' ? 'White' : 'Black'}`;
  $('drawBox').style.display = st.drawOffer && !st.result ? 'flex' : 'none';
  $('draw').disabled = $('resign').disabled = !!st.result;
  const mv = $('moves'); mv.innerHTML = '';
  st.history.forEach((san, i) => {
    if (i % 2 === 0) mv.insertAdjacentHTML('beforeend', `<span class="n">${i / 2 + 1}.</span>`);
    mv.insertAdjacentHTML('beforeend', `<span>${san}</span>`);
  });
  mv.scrollTop = mv.scrollHeight;
}

function findKing(grid, turn) {
  const k = turn === 'w' ? 'K' : 'k';
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) if (grid[r][f] === k) return 'abcdefgh'[f] + (8 - r);
}

function clickSq(name) {
  if (!st || st.result) return;
  const mine = st.moves.filter(m => m.from === name);
  if (selected && selected !== name) {
    const m = st.moves.find(x => x.from === selected && x.to === name);
    if (m) {
      if (m.promo) return askPromo(selected, name);
      send({ type: 'move', from: selected, to: name });
      selected = null; return;
    }
  }
  selected = mine.length ? name : null;
  show();
}

function askPromo(from, to) {
  const box = $('promo'), inner = box.firstElementChild;
  inner.innerHTML = '';
  for (const p of ['q', 'r', 'b', 'n']) {
    const b = document.createElement('button');
    b.textContent = GLYPH[p];
    b.onclick = () => { box.style.display = 'none'; send({ type: 'move', from, to, promotion: p }); selected = null; };
    inner.appendChild(b);
  }
  box.style.display = 'flex';
}
</script>
</body>
</html>
